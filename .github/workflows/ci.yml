name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ versionado precisa estar atualizado
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ está desatualizado em relação a src/. Rode 'npm run build' e commite a pasta dist." >&2
            git --no-pager diff --stat -- dist
            exit 1
          fi
